name: Build Android Standalone APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Configure Environment & Android SDK
        run: |
          echo "EXPO_PUBLIC_API_URL=https://vibestream-api-iet5.onrender.com/api" > mobile/.env
          echo "sdk.dir=/usr/local/lib/android/sdk" > mobile/android/local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          chmod +x mobile/android/gradlew

      - name: Build Standalone APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          ANDROID_HOME: /usr/local/lib/android/sdk
          EXPO_PUBLIC_API_URL: "https://vibestream-api-iet5.onrender.com/api"
        run: |
          set -o pipefail
          cd mobile/android
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../gradle.log

      - name: Report Build Logs to Step Summary
        if: always()
        run: |
          echo "### 📋 Gradle Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f gradle.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 gradle.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No gradle.log found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle.log
          if-no-files-found: ignore

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "=== SEARCHING FOR GENERATED APK FILES ==="
          find mobile/android/app/build/outputs/ -type f -name "*.apk" || true
          APK_PATH=$(find mobile/android/app/build/outputs/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/VibeStream.apk
            ls -la build-output/
          else
            echo "ERROR: No APK was found in build outputs!"
            exit 1
          fi

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeStream-Music-App
          path: build-output/VibeStream.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.0.0-apk
          name: "VibeStream v2.0.0 Standalone APK"
          body: |
            ### 🎵 VibeStream Standalone Android APK
            
            Download and install `VibeStream.apk` directly on any Android phone (no Expo Go needed)!
            
            - **All Music Streaming**: JioSaavn 320kbps + YouTube Music + Jamendo
            - **Background Audio**: Lock-screen media controls & persistent playback
            - **Synced Lyrics**: Spotify-style animated lyric tracking
            - **Offline Downloads**: Save tracks to your phone
          files: build-output/VibeStream.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
